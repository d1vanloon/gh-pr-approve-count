name: Build Extension

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to set in package.json (optional)'
        required: false
        type: string
      create_release:
        description: 'Whether to create a release'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'The version that was built'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Extract or set version
      id: version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          # Use provided version (for releases)
          VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using provided version: $VERSION"
        else
          # Extract from package.json for regular builds
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using package.json version: $VERSION"
        fi
        
    - name: Update package.json version
      if: inputs.version != ''
      run: |
        npm version ${{ steps.version.outputs.version }} --no-git-tag-version
        echo "Updated package.json version to ${{ steps.version.outputs.version }}"
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Verify build output
      run: |
        if [ ! -f "dist/manifest.json" ]; then
          echo "Build failed: manifest.json not found"
          exit 1
        fi
        if [ ! -f "dist/content.js" ]; then
          echo "Build failed: content.js not found"
          exit 1
        fi
        echo "Build verification successful"
        
    - name: Create release archive
      if: inputs.create_release
      run: |
        cd dist
        zip -r ../gh-pr-approve-count-v${{ steps.version.outputs.version }}.zip .
        cd ..
        echo "Created release archive: gh-pr-approve-count-v${{ steps.version.outputs.version }}.zip"
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      if: inputs.create_release
      with:
        files: gh-pr-approve-count-v${{ steps.version.outputs.version }}.zip
        generate_release_notes: true

    - name: Release Edge Extension
      uses: baptistecdr/release-edge-extension@v2.0.1
      if: inputs.create_release
      with:
        api-key: ${{ secrets.PUBLISH_API_KEY }}
        client-id: ${{ secrets.PUBLISH_CLIENT_ID }}
        product-id: ${{ vars.PUBLISH_PRODUCT_ID }}
        product-path: gh-pr-approve-count-v${{ steps.version.outputs.version }}.zip
